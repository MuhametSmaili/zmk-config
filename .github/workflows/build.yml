name: Build ZMK firmware
on:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'boards/**'
      - 'src/**'
      - 'include/**'
      - 'dts/**'
      - 'zephyr/**'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - '.github/workflows/build.yml'
      - 'build.yaml'
  pull_request:
    paths:
      - 'config/**'
      - 'boards/**'
      - 'src/**'
      - 'include/**'
      - 'dts/**'
      - 'zephyr/**'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - '.github/workflows/build.yml'
      - 'build.yaml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
