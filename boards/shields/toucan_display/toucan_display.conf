# Keep the Toucan2's 144x168 panel, with plain percentage/connection labels.
# The nice_view shield supplies the driver, not its fixed-size status widget.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n
# Headroom for label/font draw tasks; the old full-screen canvas is gone.
CONFIG_LV_Z_MEM_POOL_SIZE=16384
# Match the status poll; no animation needs the default 10 ms display wakeups.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=250
