- p: [12, 13]
  k: Delete
  l: [BASE]
- p: [21, 22]
  k: Copy
  l: [BASE]
- p: [22, 23]
  k: Paste
  l: [BASE]
- p: [6, 7, 8]
  k: Scroll ↑
