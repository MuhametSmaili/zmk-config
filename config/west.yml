manifest:
  remotes:
    # zmk official
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Urchin keeb
    - name: duckyb
      url-base: https://github.com/duckyb
    # Forager keeb
    - name: carrefinho
      url-base: https://github.com/carrefinho
    # Extra module for battery indicator
    - name: caksoylar
      url-base: https://github.com/caksoylar
    # Case mode behavior module
    - name: msmaili
      url-base: https://github.com/MSmaili
    # OS-aware shortcut module
    - name: mentaldesk
      url-base: https://github.com/mentaldesk
    # Toucan hardware, screen, and trackpad modules
    - name: toucan
      url-base: https://github.com/MuhametSmaili
    - name: beekeeb
      url-base: https://github.com/beekeeb
    # Halcyon dongle board
    - name: splitkb
      url-base: https://github.com/splitkb
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: urchin-zmk-module
      remote: duckyb
      revision: main
    - name: forager-zmk-module
      remote: carrefinho
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    - name: zmk-case-mode
      remote: msmaili
      revision: main
    - name: oskey
      remote: mentaldesk
      revision: main
    - name: zmk-keyboard-toucan2
      remote: toucan
      revision: main
    - name: zmk_driver_azoteq
      remote: beekeeb
      revision: main
    - name: zmk-input-zoom
      remote: beekeeb
      revision: main
    - name: zmk-halcyon-module
      remote: splitkb
      revision: main
  self:
    path: config
